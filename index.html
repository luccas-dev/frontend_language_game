<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Game</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>STUDY GAME</h1>
        <div id="temporizador">
            Tempo Restante: <span id="tempo"></span>
        </div>
    </header>

    <main>
        <div id="message"></div>
        <h2 id="word_selected"></h2>
        <div class="response-container">
            <label for="response">
                Sua Resposta:
                <input type="text" id="response" name="response">
            </label>
            <button id="btn-send">Enviar</button>
        </div>
    </main>

    <div id="modal">
        <div class="container">
            <label for="nome">
                Nome:
                <input type="text" name="nome" id="nome">
            </label>

            <label for="level">
                Dificuldade:
                <select name="level" id="level">
                    <option value="1">Fácil</option>
                    <option value="2">Médio</option>
                    <option value="3">Dificil</option>
                </select>
            </label>
            <button id="startButton">Start Game</button>
        </div>
    </div>

    <div id="end-modal">
        <div class="container">
            <h2>DADOS DO JOGO</h2>
            <span id="player-name"><strong>Nome do Jogador:</strong> </span>
            <span id="level-game"><strong>Dificuldade:</strong> </span>
            <span id="correct-words"><strong>Palavras Corretas:</strong> </span>
            <span id="wrong-words"><strong>Palavras Erradas:</strong> </span>
            <div class="buttons">
                <button id="btn-cancel" class="btn">Cancelar</button>
                <button id="btn-save" class="btn">Salvar</button>
            </div>
        </div>
        <div id="wrong-words-container" class="container">
            <h3>Palavras Erradas - Traduções</h3>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
