<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destrava Língua</title>

    <link rel="stylesheet" href="./assets/css/index.css">
</head>
<body>
    <main>
        <section id="config-modal">
            <header>
                <h1>Destrava Língua</h1>
                <p>Configure Sua Sessão</p>
            </header>
            <div class="container">
                <h3>Usuário</h3>
                <input type="text" name="nome" id="nome" required>
            </div>
    
            <div class="container">
                <h3>Idiomas</h3>
                <div class="languages">
                    <div>
                        <input type="radio" name="idioma" id="coreano_portugues" value="coreano">
                        <label for="coreano_portugues">Coreano > Português</label>
                    </div>
    
                    <div>
                        <input type="radio" name="idioma" id="" value="" disabled>
                        <label for="">Em Breve</label>
                    </div>
    
                    <div>
                        <input type="radio" name="idioma" id="" value="" disabled>
                        <label for="">Em Breve</label>
                    </div>
                </div>
            </div>

            <div class="container">
                <h3>Tempo</h3>
                <div class="time">
                    <div>
                        <input type="radio" name="time" id="time-3" value="180">
                        <label for="time-3">3 Minutos</label>
                    </div>
    
                    <div>
                        <input type="radio" name="time" id="time-5" value="300">
                        <label for="time-5">5 Minutos</label>
                    </div>
    
                    <div>
                        <input type="radio" name="time" id="time-10" value="600">
                        <label for="time-10">10 Minutos</label>
                    </div>
                </div>
            </div>
    
            <div class="container">
                <h3>Dificuldade</h3>
                <div class="levels">
                    <div>
                        <input type="radio" name="difficulty" id="difficulty-1" value="1">
                        <label for="difficulty-1">Fácil</label>
                    </div>
    
                    <div>
                        <input type="radio" name="difficulty" id="difficulty-2" value="2">
                        <label for="difficulty-2">Médio</label>
                    </div>
    
                    <div>
                        <input type="radio" name="difficulty" id="difficulty-3" value="3">
                        <label for="difficulty-3">Difícil</label>
                    </div>
                </div>
            </div>
    
            <button id="btn-start">Iniciar Teste</button>
        </section>

        <section id="game-modal">
            <div id="temporizador">
                <span id="tempo">10:00</span>
            </div>
            <div class="words">
                <h2 id="word_selected"></h2>
                <span id="translation"></span>
            </div>
            <div class="response-container">
                <span id="message"></span>
                <input type="text" name="response" id="response" required placeholder="Digite sua resposta">
                <button id="btn-send">Enviar Resposta</button>
            </div>
        </section>

        <section id="end-modal">
            <div class="container">
                <h2>Fim da Partida</h2>

                <div class="game-data">
                    <div id="player-name-container">
                        <strong>Player Name</strong>
                        <span id="player-name"></span>
                    </div>
                    <div id="difficulty">
                        <strong>Dificuldade:</strong>
                        <span id="level-game"></span>
                    </div>

                    <div id="corrects-wrongs">
                        <strong>Corretas / Erradas</strong>
                        <p>
                            <span id="correct-words"></span> / <span id="wrong-words"></span>
                        </p>
                    </div>
                </div>
            </div>
            <div id="words-container" class="container">
                <h3>Histórico da Partida</h3>
                <p id="subtitle">
                    <span>Palavra</span>
                    <span>Resposta > Tradução</span>
                </p>
            </div>

            <div class="buttons">
                <button id="btn-cancel" class="btn">Cancelar</button>
                <button id="btn-save" class="btn">Salvar</button>
            </div>
        </section>
    </main>

    <script src="./assets/js/script.js"></script>
</body>
</html>
